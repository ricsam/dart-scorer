name: Publish online image
# Publishing an image does not replace a live deployment or modify its persistent data.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.repository == 'ricsam/dart-scorer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ricsam/dart-scorer:online
            ghcr.io/ricsam/dart-scorer:sha-${{ github.sha }}
