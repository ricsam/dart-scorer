apiVersion: v1
kind: Namespace
metadata:
  name: dart-scorer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dart-scorer
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dart-scorer
  namespace: dart-scorer
  labels:
    app.kubernetes.io/name: dart-scorer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dart-scorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dart-scorer
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: site-assets
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: site-assets
          configMap:
            name: site-assets
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: dart-scorer
  namespace: dart-scorer
spec:
  selector:
    app.kubernetes.io/name: dart-scorer
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dart-scorer
  namespace: dart-scorer
spec:
  ingressClassName: traefik
  rules:
    - host: darts-v7rm7qivt07h.r5d.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dart-scorer
                port:
                  number: 80

