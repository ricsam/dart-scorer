# Online edition. Standalone GitHub Pages deployment is independent.
# Replace the image with an immutable digest before applying. OAuth Secret is provisioned separately.
apiVersion: v1
kind: Namespace
metadata:
  name: dart-scorer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oche-data
  namespace: dart-scorer
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oche
  namespace: dart-scorer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oche
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oche
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: hetzner-kata-2
      imagePullSecrets:
        - name: ghcr-registry
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/ricsam/dart-scorer@sha256:dd2646ae06e6add857f75ef856475129cdd4c8af2b6b26d35618b895fbbd33c7
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUBLIC_URL
              value: https://darts-v7rm7qivt07h.r5d.app
            - name: TRUST_PROXY
              value: "true"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oche-google
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oche-google
                  key: GOOGLE_CLIENT_SECRET
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oche-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oche
  namespace: dart-scorer
spec:
  selector:
    app.kubernetes.io/name: oche
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oche
  namespace: dart-scorer
spec:
  ingressClassName: traefik
  rules:
    - host: darts-v7rm7qivt07h.r5d.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oche
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oche-ingress
  namespace: dart-scorer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oche
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
